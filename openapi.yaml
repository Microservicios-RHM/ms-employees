{
  "openapi": "3.1.0",
  "info": {
    "title": "Microservicio de empleados",
    "version": "1.0.0",
    "description": "API para registrar y consultar empleados. Los datos son persistidos en PostgreSQL por el microservicio de empleados."
  },
  "servers": [
    {
      "url": "/",
      "description": "Servidor actual"
    }
  ],
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Health",
      "description": "Estado operativo del microservicio"
    },
    {
      "name": "Empleados",
      "description": "Registro y consulta de empleados"
    },
    {
      "name": "Administración",
      "description": "Operaciones administrativas protegidas"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "tags": [
          "Health"
        ],
        "summary": "Consultar el estado del servicio",
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "El proceso está activo.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                },
                "example": {
                  "success": true,
                  "message": "Servicio disponible",
                  "data": {
                    "status": "UP"
                  }
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    },
    "/empleados": {
      "get": {
        "tags": [
          "Empleados"
        ],
        "summary": "Listar empleados (con filtros de auditoría opcionales)",
        "description": "Sin filtros, lista todos los empleados. `estado=RETIRADO` lista solo los retirados; `desde`/`hasta` (YYYY-MM-DD) acotan por fechaRetiro y solo tienen efecto sobre empleados retirados, ya que son los únicos con esa fecha.",
        "operationId": "listEmployees",
        "parameters": [
          {
            "name": "estado",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "ACTIVO",
                "EN_VACACIONES",
                "RETIRADO"
              ]
            },
            "example": "RETIRADO"
          },
          {
            "name": "desde",
            "in": "query",
            "required": false,
            "description": "Filtra por fechaRetiro >= desde (YYYY-MM-DD).",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-01-01"
          },
          {
            "name": "hasta",
            "in": "query",
            "required": false,
            "description": "Filtra por fechaRetiro <= hasta (YYYY-MM-DD).",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-06-30"
          }
        ],
        "responses": {
          "200": {
            "description": "Empleados consultados correctamente",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmployeeListResponse"
                }
              }
            }
          },
          "400": {
            "description": "estado, desde u hasta con formato inválido, o desde posterior a hasta.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ValidationErrorResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "500": {
            "$ref": "#/components/responses/InternalServerError"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      },
      "post": {
        "tags": [
          "Empleados"
        ],
        "summary": "Registrar un empleado",
        "description": "Registra un empleado activo. El id, email y número de empleado deben ser únicos, y el departamento se valida por HTTP.",
        "operationId": "registerEmployee",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateEmployeeRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Empleado registrado correctamente.",
            "headers": {
              "Location": {
                "description": "URI relativa del empleado creado.",
                "schema": {
                  "type": "string",
                  "example": "/empleados/E001"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmployeeResponse"
                }
              }
            }
          },
          "400": {
            "description": "Datos inválidos, datos duplicados o departamento inexistente.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/ErrorResponse"
                    },
                    {
                      "$ref": "#/components/schemas/ValidationErrorResponse"
                    }
                  ]
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "413": {
            "description": "El cuerpo de la solicitud supera el límite de 1 MB.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "example": {
                  "success": false,
                  "message": "El cuerpo de la solicitud supera el tamaño máximo permitido",
                  "data": null,
                  "error": {
                    "code": "REQUEST_BODY_TOO_LARGE",
                    "status": 413,
                    "path": "/empleados",
                    "timestamp": "2026-02-10T12:00:00.000Z"
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/InternalServerError"
          },
          "503": {
            "description": "El servicio de departamentos no está disponible después de los reintentos.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "example": {
                  "success": false,
                  "message": "No fue posible validar el departamento porque el servicio no está disponible",
                  "data": null,
                  "error": {
                    "code": "DEPARTMENT_SERVICE_UNAVAILABLE",
                    "status": 503,
                    "path": "/empleados",
                    "timestamp": "2026-02-10T12:00:00.000Z"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/empleados/cache/departamentos": {
      "delete": {
        "tags": [
          "Administración"
        ],
        "summary": "Limpiar el catálogo de departamentos en caché",
        "operationId": "clearDepartmentCatalogCache",
        "parameters": [
          {
            "name": "X-Cache-Admin-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Caché limpiada correctamente."
          },
          "401": {
            "description": "Token de administración inválido."
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    },
    "/empleados/{id}": {
      "get": {
        "tags": [
          "Empleados"
        ],
        "summary": "Consultar un empleado por identificador",
        "operationId": "getEmployeeById",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Identificador único del empleado.",
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "example": "E001"
          }
        ],
        "responses": {
          "200": {
            "description": "Empleado encontrado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmployeeResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "description": "El empleado solicitado no existe.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "example": {
                  "success": false,
                  "message": "El empleado con id E999 no existe",
                  "data": null,
                  "error": {
                    "code": "EMPLOYEE_NOT_FOUND",
                    "status": 404,
                    "path": "/empleados/E999",
                    "timestamp": "2026-02-10T12:00:00.000Z"
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/InternalServerError"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      },
      "put": {
        "tags": [
          "Empleados"
        ],
        "summary": "Actualizar un empleado",
        "description": "Actualiza nombre, apellido, email, cargo, área y departamento de un empleado activo. El id, numeroEmpleado, fechaIngreso y estado no se modifican por este endpoint. Publica el evento empleado.actualizado.",
        "operationId": "updateEmployee",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Identificador único del empleado.",
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "example": "E001"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateEmployeeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Empleado actualizado correctamente.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmployeeResponse"
                }
              }
            }
          },
          "400": {
            "description": "Datos inválidos, email duplicado, departamento inexistente o empleado retirado.",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/ErrorResponse"
                    },
                    {
                      "$ref": "#/components/schemas/ValidationErrorResponse"
                    }
                  ]
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "description": "El empleado solicitado no existe.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "example": {
                  "success": false,
                  "message": "El empleado con id E999 no existe",
                  "data": null,
                  "error": {
                    "code": "EMPLOYEE_NOT_FOUND",
                    "status": 404,
                    "path": "/empleados/E999",
                    "timestamp": "2026-02-10T12:00:00.000Z"
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/InternalServerError"
          },
          "503": {
            "description": "El servicio de departamentos no está disponible después de los reintentos.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      },
      "delete": {
        "tags": [
          "Empleados"
        ],
        "summary": "Retirar un empleado (baja lógica)",
        "description": "No borra el registro: transiciona estado a RETIRADO y persiste fechaRetiro. Publica el evento empleado.retirado. Un empleado ya RETIRADO no puede retirarse de nuevo.",
        "operationId": "retireEmployee",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Identificador único del empleado.",
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "example": "E001"
          }
        ],
        "responses": {
          "200": {
            "description": "Empleado retirado correctamente.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EmployeeResponse"
                }
              }
            }
          },
          "400": {
            "description": "El empleado ya está RETIRADO.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "example": {
                  "success": false,
                  "message": "El empleado con id E001 está retirado y no puede modificarse",
                  "data": null,
                  "error": {
                    "code": "EMPLOYEE_RETIRED",
                    "status": 400,
                    "path": "/empleados/E001",
                    "timestamp": "2026-02-10T12:00:00.000Z"
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "description": "El empleado solicitado no existe.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/InternalServerError"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Token obtenido en POST /auth/login a través del API Gateway. Pulse Authorize y pegue el valor de accessToken."
      }
    },
    "schemas": {
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "UP"
            ]
          }
        }
      },
      "HealthResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "success",
          "message",
          "data"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "const": true
          },
          "message": {
            "type": "string",
            "example": "Servicio disponible"
          },
          "data": {
            "$ref": "#/components/schemas/Health"
          }
        }
      },
      "Employee": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "nombre",
          "apellido",
          "email",
          "numeroEmpleado",
          "cargo",
          "area",
          "departamentoId",
          "fechaIngreso",
          "estado",
          "fechaRetiro"
        ],
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 50,
            "example": "E001"
          },
          "nombre": {
            "type": "string",
            "maxLength": 100,
            "example": "Juan"
          },
          "apellido": {
            "type": "string",
            "maxLength": 100,
            "example": "Pérez"
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 254,
            "example": "juan.perez@empresa.com"
          },
          "numeroEmpleado": {
            "type": "string",
            "maxLength": 50,
            "example": "EMP-2026-001"
          },
          "cargo": {
            "type": "string",
            "maxLength": 150,
            "example": "Desarrollador Senior"
          },
          "area": {
            "type": "string",
            "maxLength": 100,
            "example": "Tecnología"
          },
          "departamentoId": {
            "type": "string",
            "maxLength": 50,
            "example": "IT"
          },
          "fechaIngreso": {
            "type": "string",
            "format": "date",
            "example": "2026-02-10"
          },
          "estado": {
            "type": "string",
            "enum": [
              "ACTIVO",
              "EN_VACACIONES",
              "RETIRADO"
            ]
          },
          "fechaRetiro": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time",
            "example": null,
            "description": "Fecha y hora del retiro. null mientras el empleado no esté RETIRADO."
          }
        }
      },
      "EmployeeResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "success",
          "message",
          "data"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "const": true
          },
          "message": {
            "type": "string",
            "example": "Empleado registrado correctamente"
          },
          "data": {
            "$ref": "#/components/schemas/Employee"
          }
        }
      },
      "EmployeeListResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "success",
          "message",
          "data"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "const": true
          },
          "message": {
            "type": "string",
            "example": "Empleados consultados correctamente"
          },
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Employee"
            }
          }
        }
      },
      "CreateEmployeeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "nombre",
          "apellido",
          "email",
          "numeroEmpleado",
          "cargo",
          "area",
          "departamentoId",
          "fechaIngreso"
        ],
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 50,
            "example": "E001"
          },
          "nombre": {
            "type": "string",
            "maxLength": 100,
            "example": "Juan"
          },
          "apellido": {
            "type": "string",
            "maxLength": 100,
            "example": "Pérez"
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 254,
            "example": "juan.perez@empresa.com"
          },
          "numeroEmpleado": {
            "type": "string",
            "maxLength": 50,
            "example": "EMP-2026-001"
          },
          "cargo": {
            "type": "string",
            "maxLength": 150,
            "example": "Desarrollador Senior"
          },
          "area": {
            "type": "string",
            "maxLength": 100,
            "example": "Tecnología"
          },
          "departamentoId": {
            "type": "string",
            "maxLength": 50,
            "example": "IT"
          },
          "fechaIngreso": {
            "type": "string",
            "format": "date",
            "example": "2026-02-10"
          }
        }
      },
      "UpdateEmployeeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "nombre",
          "apellido",
          "email",
          "cargo",
          "area",
          "departamentoId"
        ],
        "properties": {
          "nombre": {
            "type": "string",
            "maxLength": 100,
            "example": "Juan"
          },
          "apellido": {
            "type": "string",
            "maxLength": 100,
            "example": "Pérez"
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 254,
            "example": "juan.perez@empresa.com"
          },
          "cargo": {
            "type": "string",
            "maxLength": 150,
            "example": "Desarrollador Senior"
          },
          "area": {
            "type": "string",
            "maxLength": 100,
            "example": "Tecnología"
          },
          "departamentoId": {
            "type": "string",
            "maxLength": 50,
            "example": "IT"
          }
        }
      },
      "ErrorResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "success",
          "message",
          "data",
          "error"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "const": false
          },
          "message": {
            "type": "string",
            "example": "El email juan.perez@empresa.com ya está registrado"
          },
          "data": {
            "type": "null"
          },
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "status",
              "path",
              "timestamp"
            ],
            "properties": {
              "code": {
                "type": "string",
                "example": "DUPLICATE_EMAIL"
              },
              "status": {
                "type": "integer",
                "example": 400
              },
              "path": {
                "type": "string",
                "example": "/empleados"
              },
              "timestamp": {
                "type": "string",
                "format": "date-time"
              }
            }
          }
        }
      },
      "ValidationErrorResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "success",
          "message",
          "data",
          "error"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "const": false
          },
          "message": {
            "type": "string",
            "example": "Datos de entrada inválidos"
          },
          "data": {
            "type": "null"
          },
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "status",
              "path",
              "timestamp",
              "details"
            ],
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "VALIDATION_ERROR"
                ]
              },
              "status": {
                "type": "integer",
                "example": 400
              },
              "path": {
                "type": "string",
                "example": "/empleados"
              },
              "timestamp": {
                "type": "string",
                "format": "date-time"
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "field",
                    "message"
                  ],
                  "properties": {
                    "field": {
                      "type": "string",
                      "example": "email"
                    },
                    "message": {
                      "type": "string",
                      "example": "email debe tener un formato válido"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "responses": {
      "InternalServerError": {
        "description": "Error no controlado en el servidor.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            },
            "example": {
              "success": false,
              "message": "Error interno del servidor",
              "data": null,
              "error": {
                "code": "INTERNAL_ERROR",
                "status": 500,
                "path": "/empleados",
                "timestamp": "2026-02-10T12:00:00.000Z"
              }
            }
          }
        }
      },
      "Error400": {
        "description": "Solicitud inválida o regla de validación incumplida.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
