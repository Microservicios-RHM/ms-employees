# Análisis de SonarQube (etapa "SonarQube" del Jenkinsfile). La URL del servidor y el token NO van
# aquí: los inyecta withSonarQubeEnv('sonarqube') desde las credenciales de Jenkins.
sonar.projectKey=ms-employees
sonar.projectName=ms-employees
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

# Cobertura generada por `npm run test:ci` en la etapa Test. SonarQube no ejecuta pruebas: la importa.
sonar.javascript.lcov.reportPaths=reports/lcov.info

# Mismas exclusiones de cobertura que test:ci (package.json): cableado y adaptadores de conexión sin
# reglas de negocio. Así el porcentaje de SonarQube coincide con el que mide la herramienta local.
sonar.coverage.exclusions=\
  src/server.ts,\
  src/infrastructure/logging/**,\
  src/infrastructure/messaging/rabbitmq/rabbitmq.connection.ts,\
  src/infrastructure/persistence/postgres/postgres.client.ts,\
  src/infrastructure/persistence/postgres/postgres-readiness.ts

# SonarQube 9.9 LTS no entiende varias opciones de tsconfig.json (TypeScript 5.x/7): sin este archivo
# no puede crear el programa de TypeScript y omite las reglas. Ver tsconfig.sonar.json.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
